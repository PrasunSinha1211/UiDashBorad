<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>{{ title or "Veremark Admin" }}</title>
    <span class="badge bg-warning text-dark ms-2">{{ env_name }}</span>

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap 5 (you can self-host later if needed) -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"
    />

    <!-- Custom styles -->
    <link rel="stylesheet" href="static/css/styles.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-semibold" href="/home">
            Veremark Admin
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav" aria-controls="navbarNav"
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link {% if request.url.path.startswith('/home') %}active{% endif %}"
                       href="/home">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.url.path.startswith('/platforms') %}active{% endif %}"
                       href="/platforms">Platforms</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.url.path.startswith('/tenants') %}active{% endif %}"
                       href="/tenants">Tenants</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.url.path.startswith('/crypto-tools') %}active{% endif %}"
                       href="/crypto-tools">Crypto Tools</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="app-main py-4">
    <div class="container">
        {% block page_header %}
        {% if title %}
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1 class="h4 mb-0">{{ title }}</h1>
            </div>
        {% endif %}
        {% endblock %}

        {% block content %}{% endblock %}
    </div>
</main>

<footer class="app-footer mt-auto py-3 border-top bg-white">
    <div class="container text-muted small d-flex justify-content-between">
        <span>© {{ now().year if now is defined else "2025" }} Veremark Admin Console</span>
        <span>Built with FastAPI · PostgreSQL</span>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

<script>
    // Generic delete confirmation helper for forms with data-confirm
    document.addEventListener("submit", function (e) {
        const form = e.target;
        const msg = form.getAttribute("data-confirm");
        if (msg) {
            const ok = confirm(msg);
            if (!ok) e.preventDefault();
        }
    });
</script>

</body>
</html>
