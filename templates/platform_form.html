{% extends "base.html" %}
{% block content %}
<h3 class="mb-3">{{ 'Edit' if p else 'New' }} Platform</h3>
<div class="card p-4">
  <form method="post" action="/platforms/save">
    {% if p %}<input type="hidden" name="id" value="{{ p.id }}">{% endif %}
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Name</label>
        <input name="name" class="form-control" required value="{{ p.name if p else '' }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">API Version</label>
        <input name="veremark_api_version" class="form-control" value="{{ p.veremark_api_version if p else '' }}">
      </div>
      <div class="col-md-12">
        <label class="form-label">API Base URL</label>
        <input name="veremark_api_base_url" class="form-control" value="{{ p.veremark_api_base_url if p else '' }}">
      </div>
      <div class="col-md-12">
        <label class="form-label">Connector API Key (encrypted)</label>
        <input name="connector_api_key" class="form-control" value="{{ p.connector_api_key if p else '' }}">
      </div>
    </div>
    <div class="mt-4 d-flex gap-2">
      <button class="btn btn-primary" type="submit">Save</button>
      <a class="btn btn-secondary" href="/platforms">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
