{% extends "base.html" %}

{% block content %}

<div class="card p-4">
    <h3 class="mb-3">🔐 Encryption / Decryption Tool</h3>
    <p class="text-muted mb-4">
        Use this tool to encrypt or decrypt values using the same AES-GCM keys used by the dashboard.
    </p>

    <form method="post" class="mb-4">

        <label class="form-label fw-bold">Input Value</label>
        <textarea name="input_value" class="form-control mb-3"
                  rows="3"
                  placeholder="Enter text to encrypt or decrypt...">{{ input_value }}</textarea>

        <label class="form-label fw-bold">Operation</label>
        <select name="mode" class="form-select mb-3" style="max-width: 220px;">
            <option value="encrypt" {% if mode == "encrypt" %}selected{% endif %}>Encrypt</option>
            <option value="decrypt" {% if mode == "decrypt" %}selected{% endif %}>Decrypt</option>
        </select>

        <button class="btn btn-primary">Run</button>
    </form>

    {% if error %}
        <div class="alert alert-danger">Error: {{ error }}</div>
    {% endif %}

    {% if result %}
        <label class="form-label fw-bold">Result</label>
        <div class="alert alert-info">
            <code style="white-space: pre-wrap;">{{ result }}</code>
        </div>
    {% endif %}

</div>

{% endblock %}
