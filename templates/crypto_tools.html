{% extends "base.html" %}
{% block page_header %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <div>
        <h1 class="h4 mb-1">Crypto Tools</h1>
        <p class="text-muted mb-0">
            Encrypt or decrypt values using the configured AES key and IV.
        </p>
    </div>
</div>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-body">
                <form method="post" action="/crypto-tools" class="row g-3">
                    <div class="col-12">
                        <label class="form-label mb-1">Mode</label>
                        <div class="btn-group" role="group">
                            <input type="radio" class="btn-check" name="mode" id="mode_encrypt"
                                   value="encrypt" autocomplete="off"
                                   {% if mode != "decrypt" %}checked{% endif %}>
                            <label class="btn btn-outline-primary btn-sm" for="mode_encrypt">
                                Encrypt
                            </label>

                            <input type="radio" class="btn-check" name="mode" id="mode_decrypt"
                                   value="decrypt" autocomplete="off"
                                   {% if mode == "decrypt" %}checked{% endif %}>
                            <label class="btn btn-outline-primary btn-sm" for="mode_decrypt">
                                Decrypt
                            </label>
                        </div>
                    </div>

                    <div class="col-12">
                        <label for="input_value" class="form-label">Input</label>
                        <textarea id="input_value" name="input_value"
                                  class="form-control font-monospace"
                                  rows="4"
                                  placeholder="Paste plaintext or ciphertext here">{{ input_value or "" }}</textarea>
                    </div>

                    {% if error %}
                        <div class="col-12">
                            <div class="alert alert-danger py-2 mb-0 small">
                                {{ error }}
                            </div>
                        </div>
                    {% endif %}

                    {% if result %}
                        <div class="col-12">
                            <label class="form-label d-flex justify-content-between align-items-center">
                                <span>Result</span>
                                <button type="button" class="btn btn-link btn-sm p-0"
                                        onclick="copyResult()">
                                    Copy
                                </button>
                            </label>
                            <textarea id="resultArea"
                                      class="form-control font-monospace"
                                      rows="4"
                                      readonly>{{ result }}</textarea>
                        </div>
                    {% endif %}

                    <div class="col-12 d-flex justify-content-end">
                        <button type="submit" class="btn btn-primary">
                            Run
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    function copyResult() {
        const el = document.getElementById("resultArea");
        if (!el) return;
        el.select();
        el.setSelectionRange(0, 99999);
        document.execCommand("copy");
        alert("Result copied to clipboard");
    }
</script>
{% endblock %}
